<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הפלאנר של מאיה ✈️</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0ede8;
  --surface: #ffffff;
  --border: #e2ddd6;
  --text: #1a1714;
  --muted: #8a8480;
  --work: #3b5bdb;
  --work-bg: #edf2ff;
  --work-light: #bac8ff;
  --personal: #0ca678;
  --personal-bg: #e6fcf5;
  --personal-light: #96f2d7;
  --urgent: #e03131;
  --urgent-bg: #fff5f5;
  --urgent-light: #ffa8a8;
  --accent: #f59f00;
  --accent-bg: #fff9db;
  --r: 14px;
  --r-sm: 9px;
  --shadow: 0 2px 16px rgba(0,0,0,.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; direction: rtl; }

/* HEADER */
header {
  background: linear-gradient(135deg, #1a1714 0%, #2d2520 100%);
  padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; height: 60px;
}
.logo { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
.logo em { color: var(--accent); font-style: normal; }
.sync-pill {
  font-size: 12px; font-weight: 600;
  padding: 5px 14px; border-radius: 20px;
  background: rgba(255,255,255,.12); color: #fff;
  display: flex; align-items: center; gap: 6px;
  transition: all .2s;
}
.sync-pill.ok { background: rgba(12,166,120,.25); color: #96f2d7; }
.sync-pill.saving { background: rgba(245,159,0,.2); color: #ffd43b; }
.sync-pill.error { background: rgba(224,49,49,.25); color: #ffa8a8; }

/* TABS */
.container { max-width: 860px; margin: 0 auto; padding: 20px 16px; }
.tabs {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden;
  margin-bottom: 20px; box-shadow: var(--shadow);
}
.tab {
  padding: 13px 10px; border: none; background: transparent;
  cursor: pointer; font-family: 'Heebo',sans-serif; font-size: 14px; font-weight: 600;
  color: var(--muted); transition: all .18s;
  border-left: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tab:last-child { border-left: none; }
.tab.active { background: var(--text); color: #fff; }
.tab:hover:not(.active) { background: var(--bg); color: var(--text); }
.section { display: none; }
.section.active { display: block; }

/* STATS BAR */
.stats-bar {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 18px;
}
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 12px 14px;
  display: flex; flex-direction: column; gap: 2px;
  box-shadow: var(--shadow);
}
.stat-num { font-size: 24px; font-weight: 900; line-height: 1; }
.stat-label { font-size: 11px; color: var(--muted); font-weight: 500; }
.stat-card.s-work .stat-num { color: var(--work); }
.stat-card.s-personal .stat-num { color: var(--personal); }
.stat-card.s-urgent .stat-num { color: var(--urgent); }
.stat-card.s-done .stat-num { color: var(--muted); }

/* FILTERS */
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filt {
  padding: 6px 16px; border: 1.5px solid var(--border);
  border-radius: 20px; background: var(--surface);
  cursor: pointer; font-family: 'Heebo',sans-serif; font-size: 13px; font-weight: 600;
  color: var(--muted); transition: all .15s;
}
.filt.active { background: var(--text); color: #fff; border-color: var(--text); }
.filt.f-work.active { background: var(--work); border-color: var(--work); }
.filt.f-personal.active { background: var(--personal); border-color: var(--personal); }
.filt.f-urgent.active { background: var(--urgent); border-color: var(--urgent); }
.filt.f-today.active { background: var(--accent); border-color: var(--accent); color: #1a1714; }

/* TASK ITEMS */
.task-item {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r); padding: 14px 16px;
  margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px;
  transition: all .18s; box-shadow: var(--shadow);
  border-right: 4px solid var(--border);
}
.task-item.cat-work { border-right-color: var(--work); }
.task-item.cat-personal { border-right-color: var(--personal); }
.task-item.cat-urgent { border-right-color: var(--urgent); }
.task-item:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(0,0,0,.1); }
.task-item.done { opacity: .5; }
.task-item.done .task-title { text-decoration: line-through; }

.task-check {
  width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 50%;
  cursor: pointer; flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.task-check.checked { background: var(--personal); border-color: var(--personal); }
.task-check.checked::after { content: '✓'; color: #fff; font-size: 12px; font-weight: 700; }

.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 15px; font-weight: 700; margin-bottom: 5px; word-break: break-word; }
.task-meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.task-notes { font-size: 13px; color: var(--muted); margin-top: 5px; line-height: 1.5; }

.badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge-work { background: var(--work-bg); color: var(--work); }
.badge-personal { background: var(--personal-bg); color: var(--personal); }
.badge-urgent { background: var(--urgent-bg); color: var(--urgent); }

.task-actions { display: flex; gap: 4px; flex-shrink: 0; }
.act-btn {
  width: 32px; height: 32px; border: 1.5px solid var(--border); border-radius: var(--r-sm);
  background: transparent; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
}
.act-btn:hover { background: var(--bg); }
.act-btn.del:hover { background: var(--urgent-bg); border-color: var(--urgent-light); }
.act-btn.edit:hover { background: var(--accent-bg); border-color: var(--accent); }

/* EDIT MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 16px;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--surface); border-radius: var(--r);
  padding: 24px; width: 100%; max-width: 480px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.modal-title { font-size: 17px; font-weight: 800; margin-bottom: 20px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }

/* TOMORROW BTN */
.tmrw-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: 20px;
  background: var(--accent-bg); border: 1.5px solid var(--accent);
  color: #7c5200; font-size: 12px; font-weight: 700; cursor: pointer;
  margin-top: 8px; transition: all .15s; font-family: 'Heebo',sans-serif;
}
.tmrw-btn:hover { background: var(--accent); color: #fff; }

/* CALENDAR */
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-nav-btn {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r-sm); padding: 8px 16px; cursor: pointer;
  font-size: 16px; font-family: 'Heebo',sans-serif; font-weight: 700;
  transition: all .15s; box-shadow: var(--shadow);
}
.cal-nav-btn:hover { background: var(--text); color: #fff; border-color: var(--text); }
.cal-title { font-size: 20px; font-weight: 900; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }
.cal-day-hdr { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 6px; }
.cal-cell {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r-sm); padding: 6px; min-height: 78px;
  cursor: pointer; transition: all .15s; box-shadow: var(--shadow);
}
.cal-cell:hover { border-color: var(--accent); transform: scale(1.02); }
.cal-cell.today { border-color: var(--work); border-width: 2px; background: var(--work-bg); }
.cal-cell.other { opacity: .3; pointer-events: none; }
.cal-num { font-size: 12px; font-weight: 800; margin-bottom: 3px; }
.cal-cell.today .cal-num { color: var(--work); }
.cal-ev {
  font-size: 10px; padding: 2px 5px; border-radius: 4px;
  margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600;
}
.cal-ev.work { background: var(--work-bg); color: var(--work); }
.cal-ev.personal { background: var(--personal-bg); color: var(--personal); }
.cal-ev.urgent { background: var(--urgent-bg); color: var(--urgent); }

/* FORM */
.form-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r); padding: 24px; box-shadow: var(--shadow);
}
.form-title { font-size: 18px; font-weight: 900; margin-bottom: 20px; }
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: .5px; }
.form-input {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border); border-radius: var(--r-sm);
  font-family: 'Heebo',sans-serif; font-size: 14px; color: var(--text);
  background: var(--bg); transition: border .15s; direction: rtl;
}
.form-input:focus { outline: none; border-color: var(--work); background: #fff; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
textarea.form-input { resize: vertical; min-height: 70px; }
.btn-save {
  flex: 1; padding: 13px; background: var(--text); color: #fff;
  border: none; border-radius: var(--r-sm); cursor: pointer;
  font-family: 'Heebo',sans-serif; font-size: 15px; font-weight: 800;
  transition: all .15s; letter-spacing: -.3px;
}
.btn-save:hover { background: #333; transform: translateY(-1px); }
.btn-clear {
  padding: 13px 20px; background: transparent; color: var(--muted);
  border: 1.5px solid var(--border); border-radius: var(--r-sm);
  cursor: pointer; font-family: 'Heebo',sans-serif; font-size: 14px; font-weight: 600;
  transition: all .15s;
}
.btn-clear:hover { background: var(--bg); }
.btn-row { display: flex; gap: 10px; margin-top: 20px; }

/* EMPTY */
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 15px; font-weight: 500; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 12px 28px;
  border-radius: 30px; font-size: 14px; font-weight: 700;
  opacity: 0; transition: opacity .3s; z-index: 999; pointer-events: none;
  box-shadow: 0 8px 32px rgba(0,0,0,.2); white-space: nowrap;
}
.toast.show { opacity: 1; }

@media(max-width:580px) {
  .form-row { grid-template-columns: 1fr; }
  .stats-bar { grid-template-columns: repeat(2,1fr); }
  header { padding: 0 14px; }
  .container { padding: 14px 10px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">✈️ הפלאנר של <em>מאיה</em></div>
  <div class="sync-pill" id="sync-pill">☁️ טוען...</div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="showTab('tasks',this)">✅ משימות</button>
    <button class="tab" onclick="showTab('calendar',this)">📅 יומן</button>
    <button class="tab" onclick="showTab('add',this)">➕ הוסף</button>
  </div>

  <!-- TASKS -->
  <div id="tasks" class="section active">
    <div class="stats-bar" id="stats-bar"></div>
    <div class="filter-bar">
      <button class="filt active" onclick="setFilter('all',this)">הכל</button>
      <button class="filt f-work" onclick="setFilter('work',this)">💼 עבודה</button>
      <button class="filt f-personal" onclick="setFilter('personal',this)">🏠 אישי</button>
      <button class="filt f-urgent" onclick="setFilter('urgent',this)">🔥 דחוף</button>
      <button class="filt f-today" onclick="setFilter('today',this)">⭐ היום</button>
    </div>
    <div id="task-list"></div>
  </div>

  <!-- CALENDAR -->
  <div id="calendar" class="section">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">→</button>
      <div class="cal-title" id="cal-title"></div>
      <button class="cal-nav-btn" onclick="changeMonth(1)">←</button>
    </div>
    <div class="cal-grid" id="cal-headers"></div>
    <div class="cal-grid" style="margin-top:5px" id="cal-body"></div>
  </div>

  <!-- ADD -->
  <div id="add" class="section">
    <div class="form-card">
      <div class="form-title">➕ משימה / אירוע חדש</div>
      <div class="form-group">
        <label class="form-label">כותרת *</label>
        <input class="form-input" id="f-title" type="text" placeholder="שם המשימה...">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">תאריך</label>
          <input class="form-input" id="f-date" type="date">
        </div>
        <div class="form-group">
          <label class="form-label">שעה</label>
          <input class="form-input" id="f-time" type="time">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">קטגוריה</label>
          <select class="form-input" id="f-cat">
            <option value="work">💼 עבודה</option>
            <option value="personal">🏠 אישי</option>
            <option value="urgent">🔥 דחוף</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">תזכורת</label>
          <select class="form-input" id="f-remind">
            <option value="">ללא</option>
            <option value="10">10 דקות לפני</option>
            <option value="30">30 דקות לפני</option>
            <option value="60">שעה לפני</option>
            <option value="1440">יום לפני</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">הערות</label>
        <textarea class="form-input" id="f-notes" placeholder="פרטים נוספים..."></textarea>
      </div>
      <div class="btn-row">
        <button class="btn-save" onclick="addTask()">💾 שמור בענן</button>
        <button class="btn-clear" onclick="clearForm()">נקה</button>
      </div>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModalIfBg(event)">
  <div class="modal">
    <div class="modal-title">✏️ עריכת משימה</div>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label class="form-label">כותרת</label>
      <input class="form-input" id="edit-title" type="text">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">תאריך</label>
        <input class="form-input" id="edit-date" type="date">
      </div>
      <div class="form-group">
        <label class="form-label">שעה</label>
        <input class="form-input" id="edit-time" type="time">
      </div>
    </div>
    <button class="tmrw-btn" onclick="setTomorrow()">📅 להזיז למחר</button>
    <div class="form-row" style="margin-top:14px">
      <div class="form-group">
        <label class="form-label">קטגוריה</label>
        <select class="form-input" id="edit-cat">
          <option value="work">💼 עבודה</option>
          <option value="personal">🏠 אישי</option>
          <option value="urgent">🔥 דחוף</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">תזכורת</label>
        <select class="form-input" id="edit-remind">
          <option value="">ללא</option>
          <option value="10">10 דקות</option>
          <option value="30">30 דקות</option>
          <option value="60">שעה</option>
          <option value="1440">יום</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">הערות</label>
      <textarea class="form-input" id="edit-notes"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-save" onclick="saveEdit()">💾 שמור</button>
      <button class="btn-clear" onclick="closeModal()">ביטול</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const DAYS_HE = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const FILE_NAME = 'maya_planner_data.json';
const API_URL = 'https://api.anthropic.com/v1/messages';

let tasks = [];
let fileId = localStorage.getItem('planner_file_id') || null;
let calMonth = new Date();
let activeFilter = 'all';

function showTab(id, el) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
  if (id === 'calendar') renderCal();
}

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.filt').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function setSyncStatus(state) {
  const b = document.getElementById('sync-pill');
  const states = {
    loading: ['☁️ טוען...', ''],
    saving:  ['⏳ שומר...', 'saving'],
    ok:      ['✅ מסונכרן', 'ok'],
    error:   ['❌ שגיאה', 'error']
  };
  const [txt, cls] = states[state] || states.ok;
  b.textContent = txt;
  b.className = 'sync-pill' + (cls ? ' ' + cls : '');
}

function catLabel(c) { return c==='work'?'עבודה':c==='personal'?'אישי':'דחוף'; }
function catIcon(c)  { return c==='work'?'💼':c==='personal'?'🏠':'🔥'; }

function renderStats() {
  const today = new Date().toISOString().split('T')[0];
  const work = tasks.filter(t=>t.cat==='work'&&!t.done).length;
  const personal = tasks.filter(t=>t.cat==='personal'&&!t.done).length;
  const urgent = tasks.filter(t=>t.cat==='urgent'&&!t.done).length;
  const done = tasks.filter(t=>t.done).length;
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-card s-work"><div class="stat-num">${work}</div><div class="stat-label">💼 עבודה</div></div>
    <div class="stat-card s-personal"><div class="stat-num">${personal}</div><div class="stat-label">🏠 אישי</div></div>
    <div class="stat-card s-urgent"><div class="stat-num">${urgent}</div><div class="stat-label">🔥 דחוף</div></div>
    <div class="stat-card s-done"><div class="stat-num">${done}</div><div class="stat-label">✅ הושלמו</div></div>`;
}

function renderTasks() {
  renderStats();
  const today = new Date().toISOString().split('T')[0];
  let filtered = tasks.filter(t => {
    if (activeFilter === 'all') return !t.done;
    if (activeFilter === 'today') return t.date === today;
    return t.cat === activeFilter && !t.done;
  });
  filtered.sort((a,b) => (a.date||'zzz').localeCompare(b.date||'zzz'));
  const list = document.getElementById('task-list');
  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🌟</div><div class="empty-text">אין משימות פתוחות כאן</div></div>`;
    return;
  }
  list.innerHTML = filtered.map(t => `
    <div class="task-item cat-${t.cat} ${t.done?'done':''}">
      <div class="task-check ${t.done?'checked':''}" onclick="toggleDone('${t.id}')"></div>
      <div class="task-body">
        <div class="task-title">${t.title}</div>
        <div class="task-meta">
          ${t.date?`<span>📅 ${t.date}</span>`:''}
          ${t.time?`<span>🕐 ${t.time}</span>`:''}
          ${t.reminder?`<span>🔔 ${t.reminder}ד'</span>`:''}
          <span class="badge badge-${t.cat}">${catIcon(t.cat)} ${catLabel(t.cat)}</span>
        </div>
        ${t.notes?`<div class="task-notes">${t.notes}</div>`:''}
      </div>
      <div class="task-actions">
        <button class="act-btn edit" onclick="openEdit('${t.id}')" title="עריכה">✏️</button>
        <button class="act-btn del" onclick="deleteTask('${t.id}')" title="מחק">🗑</button>
      </div>
    </div>`).join('');
}

// EDIT MODAL
function openEdit(id) {
  const t = tasks.find(t=>t.id===id);
  if (!t) return;
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-title').value = t.title;
  document.getElementById('edit-date').value = t.date||'';
  document.getElementById('edit-time').value = t.time||'';
  document.getElementById('edit-cat').value = t.cat;
  document.getElementById('edit-remind').value = t.reminder||'';
  document.getElementById('edit-notes').value = t.notes||'';
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
function closeModalIfBg(e) { if (e.target.id==='modal-overlay') closeModal(); }

function setTomorrow() {
  const d = new Date(); d.setDate(d.getDate()+1);
  document.getElementById('edit-date').value = d.toISOString().split('T')[0];
}

function saveEdit() {
  const id = document.getElementById('edit-id').value;
  const t = tasks.find(t=>t.id===id);
  if (!t) return;
  t.title = document.getElementById('edit-title').value.trim() || t.title;
  t.date = document.getElementById('edit-date').value;
  t.time = document.getElementById('edit-time').value;
  t.cat = document.getElementById('edit-cat').value;
  t.reminder = document.getElementById('edit-remind').value;
  t.notes = document.getElementById('edit-notes').value.trim();
  closeModal();
  saveToCloud();
  toast('✅ המשימה עודכנה!');
}

// CALENDAR
function renderCal() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  document.getElementById('cal-title').textContent = MONTHS[m] + ' ' + y;
  document.getElementById('cal-headers').innerHTML = DAYS_HE.map(d=>`<div class="cal-day-hdr">${d}</div>`).join('');
  const first = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();
  const today = new Date().toISOString().split('T')[0];
  let cells = '';
  for (let i=0;i<first;i++) {
    cells += `<div class="cal-cell other"><div class="cal-num">${prevDays-first+1+i}</div></div>`;
  }
  for (let d=1;d<=daysInMonth;d++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds===today;
    const dayTasks = tasks.filter(t=>t.date===ds);
    const dots = dayTasks.slice(0,3).map(t=>`<div class="cal-ev ${t.cat}">${t.title}</div>`).join('');
    cells += `<div class="cal-cell ${isToday?'today':''}" onclick="pickDate('${ds}')">
      <div class="cal-num">${d}</div>${dots}
    </div>`;
  }
  document.getElementById('cal-body').innerHTML = cells;
}

function changeMonth(d) { calMonth.setMonth(calMonth.getMonth()+d); renderCal(); }

function pickDate(date) {
  document.getElementById('f-date').value = date;
  const addTab = document.querySelectorAll('.tab')[2];
  showTab('add', addTab);
}

// ADD TASK
function addTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { toast('⚠️ חובה להזין כותרת'); return; }
  const task = {
    id: Date.now().toString(), title,
    date: document.getElementById('f-date').value,
    time: document.getElementById('f-time').value,
    cat: document.getElementById('f-cat').value,
    reminder: document.getElementById('f-remind').value,
    notes: document.getElementById('f-notes').value.trim(),
    done: false
  };
  tasks.push(task);
  saveToCloud();
  clearForm();
  toast('✅ נשמר בענן!');
}

function clearForm() {
  ['f-title','f-notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('f-time').value='';
  document.getElementById('f-cat').value='work';
  document.getElementById('f-remind').value='';
}

function toggleDone(id) {
  const t = tasks.find(t=>t.id===id);
  if (t) { t.done=!t.done; saveToCloud(); renderTasks(); }
}

function deleteTask(id) {
  if (!confirm('למחוק את המשימה?')) return;
  tasks = tasks.filter(t=>t.id!==id);
  saveToCloud(); renderTasks();
}

// CLOUD
async function callAPI(sys, msg) {
  const res = await fetch(API_URL, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-20250514', max_tokens:1000,
      system: sys, messages:[{role:'user',content:msg}],
      mcp_servers:[{type:'url',url:'https://drivemcp.googleapis.com/mcp/v1',name:'gdrive'}]
    })
  });
  return res.json();
}

async function saveToCloud() {
  setSyncStatus('saving'); renderTasks();
  try {
    const content = JSON.stringify({tasks, updated:new Date().toISOString()});
    const data = await callAPI(
      `You are a Google Drive file manager. Save JSON data to a file named "${FILE_NAME}".
If fileId is provided update it, otherwise create new. Respond ONLY with JSON (no markdown): {"fileId":"...","status":"ok"}`,
      `Save. fileId:${fileId||'null'}. Content:${content}`
    );
    const txt = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    try {
      const p = JSON.parse(txt.replace(/```json|```/g,'').trim());
      if (p.fileId) { fileId=p.fileId; localStorage.setItem('planner_file_id',fileId); }
    } catch {}
    setSyncStatus('ok');
  } catch { setSyncStatus('error'); toast('❌ שגיאת שמירה'); }
}

async function loadFromCloud() {
  setSyncStatus('loading');
  try {
    const data = await callAPI(
      `You are a Google Drive file manager. Find file "${FILE_NAME}" and return its raw JSON content only (no markdown). If not found return {"tasks":[],"updated":null}`,
      `Load planner. Known fileId:${fileId||'null'}`
    );
    const txt = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    try {
      const p = JSON.parse(txt.replace(/```json|```/g,'').trim());
      tasks = p.tasks||[];
    } catch { tasks=[]; }
    setSyncStatus('ok');
  } catch { tasks=[]; setSyncStatus('error'); }
  renderTasks(); renderCal();
}

clearForm();
loadFromCloud();
</script>
